<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FPGA2026 · 曲谱上位机</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0b0e14; --panel:#141a24; --panel2:#1b2330; --line:#26303f;
    --fg:#e8eefc; --dim:#8695ab; --acc:#4ea1ff; --acc2:#79bcff;
    --ok:#3ddc84; --warn:#ffb020; --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 700px at 20% -10%,#16202e 0%,var(--bg) 60%);
    color:var(--fg); font:14px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:12px 20px;
    background:linear-gradient(180deg,#141a24,#111722); border-bottom:1px solid var(--line);
  }
  header h1{font-size:17px; margin:0; letter-spacing:.4px; font-weight:700}
  header h1 span{color:var(--acc)}
  .spacer{flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--err);display:inline-block;
       margin-right:7px; box-shadow:0 0 10px currentColor; color:var(--err)}
  .dot.on{background:var(--ok); color:var(--ok)}
  #connTxt{color:var(--dim); font-size:13px}
  main{flex:1; display:flex; gap:12px; padding:12px; min-height:0}
  .col{display:flex; flex-direction:column; gap:12px; min-height:0}
  .left{width:280px; flex:none}
  .right{width:300px; flex:none}
  .mid{flex:1; min-width:0}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.25);
  }
  .card h2{margin:0 0 10px; font-size:12px; letter-spacing:1.2px; color:var(--acc);
           text-transform:uppercase; font-weight:700}
  button{
    font:inherit; border:0; border-radius:9px; padding:9px 14px; cursor:pointer;
    background:var(--panel2); color:var(--fg); transition:.15s; border:1px solid var(--line);
  }
  button:hover:not(:disabled){background:#233046; border-color:#33445e}
  button:disabled{opacity:.42; cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,var(--acc),#2f7fd6); color:#04121f;
                 font-weight:700; border:0; box-shadow:0 4px 16px rgba(78,161,255,.3)}
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,var(--acc2),#3a8fe0)}
  button.wide{width:100%}
  .row{display:flex; gap:8px}
  .row>*{flex:1}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:13px}
  .kv b{color:var(--dim); font-weight:500}
  .kv span{font-family:Consolas,ui-monospace,monospace; text-align:right; word-break:break-all}
  #drop{
    border:1.5px dashed #33445e; border-radius:10px; padding:16px 10px; text-align:center;
    color:var(--dim); font-size:13px; transition:.15s; cursor:pointer;
  }
  #drop.hot{border-color:var(--acc); background:#16202e; color:var(--fg)}
  #fname{font-size:12px; color:var(--dim); margin-top:8px; word-break:break-all}
  #rollWrap{flex:1; min-height:0; position:relative; background:var(--panel);
            border:1px solid var(--line); border-radius:12px; overflow:hidden}
  #roll{width:100%; height:100%; display:block}
  .bar{height:8px; background:var(--panel2); border-radius:6px; overflow:hidden; margin-top:10px}
  .bar>i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--acc),var(--ok));
         transition:width .12s}
  .big{font-family:Consolas,ui-monospace,monospace; font-size:22px; font-weight:700}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center}
  .stats div{background:var(--panel2); border-radius:9px; padding:8px 4px}
  .stats small{display:block; color:var(--dim); font-size:11px; margin-bottom:2px}
  .stats b{font-family:Consolas,monospace; font-size:16px}
  #log{height:120px; overflow:auto; font:12px/1.5 Consolas,ui-monospace,monospace;
       color:var(--dim); background:#0e131b; border:1px solid var(--line); border-radius:9px;
       padding:8px; white-space:pre-wrap}
  #log .t{color:#5b6b82} #log .ok{color:var(--ok)} #log .er{color:var(--err)}
  .hint{color:var(--dim); font-size:12px; margin-top:6px}
  .pill{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px;
        background:var(--panel2); border:1px solid var(--line); color:var(--dim)}
  #warn{display:none; margin:0 12px 0; padding:10px 14px; border-radius:10px;
        background:#3a2a10; border:1px solid #6b4d16; color:#ffd591; font-size:13px}
</style>
</head>
<body>
<header>
  <h1>FPGA2026 · <span>曲谱上位机</span></h1>
  <span class="pill" id="proto">—</span>
  <div class="spacer"></div>
  <span id="connTxt"><i class="dot" id="dot"></i>未连接</span>
  <button id="btnConn" class="primary">连接蓝牙</button>
</header>

<div id="warn"></div>

<main>
  <div class="col left">
    <div class="card">
      <h2>谱面</h2>
      <div id="drop">点这里选择，或把 events.hex / .mid 拖进来</div>
      <input type="file" id="file" accept=".hex,.mid,.midi,.txt" hidden>
      <div id="fname">（未打开）</div>
    </div>
    <div class="card">
      <h2>统计</h2>
      <div class="kv"><b>事件数</b><span id="s_n">-</span></div>
      <div class="kv"><b>时长</b><span id="s_dur">-</span></div>
      <div class="kv"><b>tick 范围</b><span id="s_tick">-</span></div>
      <div class="kv"><b>变速点</b><span id="s_tempo">-</span></div>
      <div class="kv"><b>类型分布</b><span id="s_kind">-</span></div>
      <div class="kv"><b>整包</b><span id="s_bytes">-</span></div>
    </div>
  </div>

  <div class="col mid">
    <div id="rollWrap"><canvas id="roll"></canvas></div>
    <div class="card" style="flex:none">
      <div class="row">
        <button id="btnUp" class="primary">一键上传</button>
        <button id="btnPlay">起播</button>
        <button id="btnStop">停止</button>
        <button id="btnClear">清池</button>
      </div>
      <div class="bar"><i id="pb"></i></div>
      <div class="kv" style="margin-top:6px"><b id="pbTxt">就绪</b><span id="pbRate"></span></div>
    </div>
  </div>

  <div class="col right">
    <div class="card">
      <h2>实时状态</h2>
      <div class="stats">
        <div><small>池 / 容量</small><b id="st_pool">-</b></div>
        <div><small>已喂帧</small><b id="st_sent">-</b></div>
        <div><small>总数帧</small><b id="st_tf">-</b></div>
        <div><small>溢出</small><b id="st_ovf">-</b></div>
        <div><small>落后</small><b id="st_late">-</b></div>
        <div><small>运行</small><b id="st_run">-</b></div>
      </div>
      <div class="hint" id="st_more">未识别帧头 <b id="st_unk">-</b> · 不匹配 <b id="st_mm">-</b></div>
      <!-- 播放进度：喂食（实测）+ 出声（估计）
           为什么要分开显示：ESP32 起播后要先灌约 10.4 秒的提前量 FPGA 才出声。
           只显示"喂食"会让人以为游标卡住、时间轴错位。 -->
      <div style="margin-top:10px">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--dim)">
          <span>喂食进度（实测）</span><span id="st_lead">-</span>
        </div>
        <div style="position:relative; height:8px; background:#0b0e14; border:1px solid var(--line);
                    border-radius:4px; margin-top:4px; overflow:hidden">
          <div id="st_bar" style="height:100%; width:0%; background:var(--acc);
                                  transition:width .25s linear"></div>
        </div>
        <div class="hint" style="margin-top:4px">
          游标 = 出声位置（估计）；要拿真实位置需 FPGA 回传实时事件
        </div>
      </div>
    </div>
    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0">
      <h2>日志</h2>
      <div id="log"></div>
    </div>
  </div>
</main>

<script>
"use strict";
/* ===========================================================================
   位域与帧格式：必须与 esp32/tools/score_word.py 逐位一致
     tick[63:44] inc[43:23] axis[22:19] vel[18:11] kind[10:9] timbre[8:7] [6:0]=0
   =========================================================================== */
const FRAME_BYTES = 9, HDR_EVENT = 0xA5, HDR_TOTAL = 0x00, RESET_FRAMES = 4;
const KIND_ON = 0, KIND_OFF = 1, KIND_TEMPO = 2;
const OFF_TICK = 44n, OFF_INC = 23n, OFF_AXIS = 19n, OFF_VEL = 11n,
      OFF_KIND = 9n, OFF_TIMBRE = 7n;
const M_TICK = 0xFFFFFn, M_INC = 0x1FFFFFn, M_AXIS = 0xFn, M_VEL = 0xFFn,
      M_KIND = 0x3n, M_TIMBRE = 0x3n;
const F_CLK = 50000000, TPS120 = 1920.003;

const SVC  = 0xABF0, CH_RECV = 0xABF1, CH_NOTI = 0xABF2, CH_CMD = 0xABF3, CH_STAT = 0xABF4;
const CMD_RESET = 0x01, CMD_STAT = 0x02, CMD_PLAY = 0x03, CMD_STOP = 0x04;
const DEV_NAME = "FPGA2026-Synth";
/* 设备名【前缀】—— Web Bluetooth 用 namePrefix 过滤，天然支持改名。
   为什么需要改名：Windows 按 MAC 缓存 GATT 服务列表，不信板子的实际 GATT
   （实测：固件正常但 PC 只看到 4 个标准特征 => 0xABF3 not found）。
   换名让 Windows 当成新设备，缓存失效。前缀匹配后 Synth/Synth2/Synth3 都能认。 */
const DEV_PREFIX = "FPGA2026-Synth";

function packWord(tick, inc, axis, vel, kind, timbre) {
  return ((BigInt(tick) & M_TICK) << OFF_TICK) |
         ((BigInt(inc) & M_INC) << OFF_INC) |
         ((BigInt(axis) & M_AXIS) << OFF_AXIS) |
         ((BigInt(vel) & M_VEL) << OFF_VEL) |
         ((BigInt(kind) & M_KIND) << OFF_KIND) |
         ((BigInt(timbre) & M_TIMBRE) << OFF_TIMBRE);
}
function unpackWord(w) {
  return {
    tick:   Number((w >> OFF_TICK) & M_TICK),
    inc:    Number((w >> OFF_INC) & M_INC),
    axis:   Number((w >> OFF_AXIS) & M_AXIS),
    vel:    Number((w >> OFF_VEL) & M_VEL),
    kind:   Number((w >> OFF_KIND) & M_KIND),
    timbre: Number((w >> OFF_TIMBRE) & M_TIMBRE),
  };
}
function wordToBytes(w) {
  const b = new Uint8Array(8);
  for (let i = 7; i >= 0; i--) { b[i] = Number(w & 0xFFn); w >>= 8n; }
  return b;
}
function frameFromWord(w) {
  const f = new Uint8Array(9); f[0] = HDR_EVENT; f.set(wordToBytes(w), 1); return f;
}
function resetSequence() {
  const a = new Uint8Array(FRAME_BYTES * RESET_FRAMES); a.fill(HDR_EVENT); return a;
}
function frameTotal(n) {
  const f = new Uint8Array(9); f[0] = HDR_TOTAL;
  let v = BigInt(n);
  for (let i = 8; i >= 1; i--) { f[i] = Number(v & 0xFFn); v >>= 8n; }
  return f;
}
const incToHz = inc => inc * F_CLK / 4294967296;
function hzToNote(hz) {
  if (hz <= 0) return "-";
  const names = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const n = Math.round(69 + 12 * Math.log2(hz / 440));
  return names[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
}
const hzToMidi = hz => hz <= 0 ? 0 : 69 + 12 * Math.log2(hz / 440);

/* ============================== 谱面 ============================== */
let score = null;   // {words:[BigInt], notes:[], tempos:[], kinds:{}, tickMax, tickMin, payload:Uint8Array}

function parseEventsHex(text) {
  const words = [];
  for (const raw of text.split(/\r?\n/)) {
    const s = raw.trim();
    if (!s || s.startsWith("#") || s.startsWith("//")) continue;
    if (s.length !== 16) throw new Error("第 " + (words.length + 1) + " 行长度不是 16：" + s);
    words.push(BigInt("0x" + s));
  }
  if (!words.length) throw new Error("文件里没有事件字");
  return words;
}

function buildScore(words, name) {
  const notes = [], tempos = [], kinds = {};
  let tickMax = 0, tickMin = Infinity;
  for (const w of words) {
    const d = unpackWord(w);
    kinds[d.kind] = (kinds[d.kind] || 0) + 1;
    tickMax = Math.max(tickMax, d.tick);
    tickMin = Math.min(tickMin, d.tick);
    if (d.kind === KIND_TEMPO) tempos.push({ tick: d.tick, inc: d.inc, hz: incToHz(d.inc) });
    else if (d.kind === KIND_ON || d.kind === KIND_OFF) {
      const hz = incToHz(d.inc);
      notes.push({ tick: d.tick, axis: d.axis, midi: hzToMidi(hz), vel: d.vel, kind: d.kind });
    }
  }
  // 把 note_on / note_off 配成【有长度的音符段】。
  // 为什么要配对：原来只画"点"，看不出音有多长 —— 而"长度"才是时值的直接体现。
  // 配对规则（按轴 + 音高）：
  //   同轴同音高的 on 之后遇到的第一个 off 就是它的结束。
  //   匹配不上 off 的 on => 用最后 tick 或下一个事件兜底（标注为悬空）。
  //   匹配不上 on 的 off => 丢弃（孤儿 off，不计入）。
  const segs = [];
  const open = new Map();          // key = axis*128+midi  ->  {seg, idx}
  let orphanOff = 0, danglingOn = 0;
  for (const n of notes) {
    const key = ((n.axis & 15) * 128) + (n.midi & 127);
    if (n.kind === KIND_ON) {
      const seg = { t0: n.tick, t1: null, axis: n.axis, midi: n.midi,
                    vel: n.vel, axis2: n.axis };
      segs.push(seg);
      open.set(key, seg);
    } else {
      const seg = open.get(key);
      if (seg) { seg.t1 = n.tick; open.delete(key); }
      else { orphanOff++; }
    }
  }
  // 收尾：还没闭合的 on
  for (const seg of open.values()) { danglingOn++; }
  if (segs.length) {
    const endTick = Math.max(tickMax, 1);
    // 用一个"最小可见长度"，免得零长度块完全看不见
    const minLen = Math.max(1, Math.round((endTick - (isFinite(tickMin) ? tickMin : 0)) / 400));
    for (const s of segs) {
      if (s.t1 === null) s.t1 = endTick;
      if (s.t1 <= s.t0) s.t1 = s.t0 + minLen;
      s.t1 = Math.max(s.t1, s.t0 + minLen);
    }
  }
  const hz0 = tempos.length ? tempos[0].hz : TPS120;
  const parts = [resetSequence(), frameTotal(words.length)];
  for (const w of words) parts.push(frameFromWord(w));
  let len = 0; for (const p of parts) len += p.length;
  const payload = new Uint8Array(len);
  let o = 0; for (const p of parts) { payload.set(p, o); o += p.length; }
  return { name, words, notes, segs, orphanOff, danglingOn, tempos, kinds,
           tickMax, tickMin,
           duration: (tickMax - (isFinite(tickMin) ? tickMin : 0)) / (hz0 || 1),
           payload };
}

/* ============================== 卷帘 ============================== */
const AXIS_COLORS = ["#4ea1ff","#3ddc84","#ffb020","#ff7ab2","#a78bfa","#22d3ee",
                     "#fb923c","#f472b6","#34d399","#facc15","#60a5fa","#c084fc",
                     "#2dd4bf","#f87171","#a3e635","#fcd34d"];
const cv = document.getElementById("roll"), ctx = cv.getContext("2d");
let playFrac = null, hover = null;

function fitCanvas() {
  const r = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.floor(r.width * dpr));
  cv.height = Math.max(1, Math.floor(r.height * dpr));
  cv.style.width = r.width + "px"; cv.style.height = r.height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener("resize", fitCanvas);

const PAD = { l: 76, r: 14, t: 14, b: 26 };
function geom() {
  const w = cv.clientWidth, h = cv.clientHeight;
  return { w, h, pw: Math.max(1, w - PAD.l - PAD.r), ph: Math.max(1, h - PAD.t - PAD.b) };
}
/* 音名（按 MIDI 音符号）—— 全名，带升号和八度。
 * 为什么要全名：原来只标 C2/C3 这种八度刻度，看不出具体是哪个音。
 * 约定：C4 = 中央 C（与 evt2midi 的换算一致）。 */
const PITCH_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function midiName(m) {
  const i = ((m % 12) + 12) % 12;
  return PITCH_NAMES[i] + (Math.floor(m / 12) - 1);
}
/* 黑键判定（用于钢琴键盘着色） */
function isBlackKey(m) {
  const i = ((m % 12) + 12) % 12;
  return (i === 1 || i === 3 || i === 6 || i === 8 || i === 10);
}
/* 左侧钢琴键盘 —— 让"哪个音"一眼可辨，不用去数参考线。
 * 只在行高够的时候画按键细节，否则退化成色带。 */
function drawPiano(lo, hi, Y, ph) {
  const rowH = ph / (hi - lo);
  const drawKeys = rowH >= 5;
  for (let m = Math.ceil(lo); m <= Math.floor(hi); m++) {
    const y0 = Y(m + 0.5), y1 = Y(m - 0.5);
    const yTop = Math.min(y0, y1), hh = Math.max(1, Math.abs(y1 - y0));
    ctx.fillStyle = isBlackKey(m) ? "#141a24" : "#e8eefc";
    ctx.fillRect(0, yTop, PAD.l - 30, hh - (drawKeys ? 1 : 0));
    if (drawKeys) {
      ctx.strokeStyle = "#0b0e14"; ctx.lineWidth = 1;
      ctx.strokeRect(0.5, yTop + 0.5, PAD.l - 31, Math.max(1, hh - 1));
    }
  }
  // 音名：C 音与所有黑键都标 —— 保证"每个音都能认出来"
  ctx.font = "10px Consolas,monospace";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  for (let m = Math.ceil(lo); m <= Math.floor(hi); m++) {
    const y = Y(m);
    if (y < PAD.t - 2 || y > PAD.t + ph + 2) continue;
    const isC = (((m % 12) + 12) % 12 === 0);
    const black = isBlackKey(m);
    // 行太密时只标 C（否则字会糊成一团）
    if (!isC && !black && rowH < 9) continue;
    if (!isC && rowH < 5) continue;
    ctx.fillStyle = isC ? "#e8eefc" : "#8695ab";
    ctx.fillText(midiName(m), PAD.l - 27, y);
  }
}
function draw() {
  const { w, h, pw, ph } = geom();
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#1b2330";
  ctx.fillRect(PAD.l, PAD.t, pw, ph);
  ctx.strokeStyle = "#26303f"; ctx.strokeRect(PAD.l + .5, PAD.t + .5, pw - 1, ph - 1);
  if (!score) {
    ctx.fillStyle = "#8695ab"; ctx.font = "14px 'Microsoft YaHei UI',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("还没有打开谱面 —— 点左边选一个 events.hex", w / 2, h / 2);
    return;
  }
  const tm = Math.max(1, score.tickMax);
  const mids = score.notes.map(n => n.midi).filter(m => m > 0);
  let lo = mids.length ? Math.min(...mids) - 1 : 0;
  let hi = mids.length ? Math.max(...mids) + 1 : 1;
  if (hi - lo < 6) { lo -= 3; hi += 3; }
  const X = t => PAD.l + (t / tm) * pw;
  const Y = m => PAD.t + ph - ((m - lo) / (hi - lo)) * ph;

  // 左侧钢琴键盘 + 音名
  drawPiano(lo, hi, Y, ph);

  // 八度参考线（保留：配合键盘看整体位置）
  ctx.font = "10px Consolas,monospace"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let m = Math.ceil(lo); m <= Math.floor(hi); m++) {
    if (((m % 12) + 12) % 12 === 0) {
      const y = Y(m);
      ctx.strokeStyle = "#212b3a"; ctx.beginPath();
      ctx.moveTo(PAD.l, y); ctx.lineTo(PAD.l + pw, y); ctx.stroke();
    }
  }
  // 变速竖线（BPM 标签太近就不画，避免重叠成一团）
  let lastLabelX = -1e9;
  for (const t of score.tempos) {
    const x = X(t.tick);
    ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = "#ffb020";
    ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, PAD.t + ph); ctx.stroke(); ctx.restore();
    if (x - lastLabelX > 62) {
      ctx.fillStyle = "#ffb020"; ctx.textAlign = "left";
      ctx.font = "10px Consolas,monospace";
      ctx.fillText((t.hz / TPS120 * 120).toFixed(0) + " BPM", x + 3, PAD.t + 10);
      lastLabelX = x;
    }
  }
  // 音符：画成【有长度的色块】（原来只画点，看不出时值）
  const segs = score.segs || [];
  const step = segs.length > 24000 ? Math.ceil(segs.length / 24000) : 1;
  const rowH = ph / (hi - lo);
  const blockH = Math.max(2, Math.min(rowH * 0.72, 12));
  for (let i = 0; i < segs.length; i += step) {
    const s = segs[i];
    const x0 = X(s.t0), x1 = X(s.t1);
    const y = Y(s.midi) - blockH / 2;
    const bw = Math.max(1.6, x1 - x0);      // 极短的音也保证看得见
    ctx.fillStyle = AXIS_COLORS[s.axis % 16];
    // 力度 => 透明度（一眼看出强弱）
    ctx.globalAlpha = 0.45 + 0.55 * Math.min(1, (s.vel || 0) / 127);
    ctx.fillRect(x0, y, bw, blockH);
    ctx.globalAlpha = 1;
  }
  // 播放游标
  if (playFrac !== null) {
    const x = PAD.l + Math.min(1, Math.max(0, playFrac)) * pw;
    ctx.strokeStyle = "#3ddc84"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, PAD.t + ph); ctx.stroke();
    ctx.lineWidth = 1;
  }
  // 轴图例
  const axes = [...new Set(score.notes.map(n => n.axis))].sort((a, b) => a - b);
  let lx = PAD.l + 4; ctx.textAlign = "left"; ctx.font = "10px Consolas,monospace";
  for (const a of axes.slice(0, 14)) {
    ctx.fillStyle = AXIS_COLORS[a % 16]; ctx.fillRect(lx, PAD.t + ph + 8, 8, 8);
    ctx.fillStyle = "#8695ab"; ctx.fillText("轴" + a, lx + 11, PAD.t + ph + 16);
    lx += 44;
  }
  // 悬停提示
  if (hover) {
    const txt = "tick " + hover.tick + " · 轴 " + hover.axis + " · " +
                hzToNote(440 * Math.pow(2, (hover.midi - 69) / 12)) +
                " · 力度 " + hover.vel + " · " + (hover.kind === KIND_ON ? "on" : "off");
    ctx.font = "11px 'Microsoft YaHei UI',sans-serif";
    const tw = ctx.measureText(txt).width;
    let bx = hover.px + 12, by = hover.py - 26;
    if (bx + tw + 12 > w) bx = hover.px - tw - 20;
    if (by < 2) by = hover.py + 16;
    ctx.fillStyle = "rgba(11,14,20,.94)"; ctx.strokeStyle = "#33445e";
    ctx.beginPath(); ctx.roundRect(bx, by, tw + 14, 22, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e8eefc"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(txt, bx + 7, by + 11);
  }
}
cv.addEventListener("mousemove", ev => {
  if (!score || !score.notes.length) return;
  const r = cv.getBoundingClientRect();
  const { pw } = geom();
  const t = (ev.clientX - r.left - PAD.l) / pw * score.tickMax;
  let best = null, bd = Infinity;
  for (const n of score.notes) { const d = Math.abs(n.tick - t); if (d < bd) { bd = d; best = n; } }
  hover = (best && bd < score.tickMax * 0.02)
    ? { ...best, px: ev.clientX - r.left, py: ev.clientY - r.top } : null;
  draw();
});
cv.addEventListener("mouseleave", () => { hover = null; draw(); });

/* ============================== UI 助手 ============================== */
const $ = id => document.getElementById(id);
function log(msg, cls) {
  const el = $("log");
  const t = new Date().toTimeString().slice(0, 8);
  el.insertAdjacentHTML("beforeend",
    '<div><span class="t">' + t + "</span> " +
    (cls ? '<span class="' + cls + '">' + msg + "</span>" : msg) + "</div>");
  el.scrollTop = el.scrollHeight;
}
function setConn(on, txt) {
  $("dot").className = "dot" + (on ? " on" : "");
  $("connTxt").innerHTML = '<i class="dot' + (on ? " on" : "") + '" id="dot"></i>' +
                           (txt || (on ? "已连接" : "未连接"));
  $("btnConn").textContent = on ? "断开" : "连接蓝牙";
}

/* ============================== Web Bluetooth ============================== */
let device = null, server = null, chRecv = null, chCmd = null, chStat = null;
let connected = false, pollTimer = null;

function uuid16(x) { return "0000" + x.toString(16).padStart(4, "0") + "-0000-1000-8000-00805f9b34fb"; }

async function connect() {
  if (!navigator.bluetooth) {
    log("这个浏览器不支持 Web Bluetooth —— 请用 Chrome 或 Edge", "er");
    return;
  }
  try {
    log("请求设备（过滤器：名字含 " + DEV_PREFIX + "）…");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "FPGA2026" }],
      optionalServices: [uuid16(SVC)],
    });
    device.addEventListener("gattserverdisconnected", () => {
      connected = false; setConn(false, "已断开"); log("蓝牙已断开", "er");
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    });
    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(uuid16(SVC));
    chRecv = await svc.getCharacteristic(uuid16(CH_RECV));
    chCmd  = await svc.getCharacteristic(uuid16(CH_CMD));
    chStat = await svc.getCharacteristic(uuid16(CH_STAT));
    connected = true;
    setConn(true, "已连接 " + (device.name || ""));
    log("已连接 " + device.name, "ok");
    startPoll();
  } catch (e) {
    log("连接失败：" + e.message, "er");
  }
}
function disconnect() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (device && device.gatt.connected) device.gatt.disconnect();
  connected = false; setConn(false);
}

async function sendCmd(code) {
  if (!connected) throw new Error("还没连上蓝牙");
  await chCmd.writeValueWithoutResponse(new Uint8Array([code]));
}
async function readStat() {
  await sendCmd(CMD_STAT);
  await new Promise(r => setTimeout(r, 420));
  const dv = await chStat.readValue();
  const txt = new TextDecoder().decode(dv);
  const g = k => { const m = txt.match(new RegExp("\\b" + k + "=(\\d+)")); return m ? +m[1] : null; };
  const pm = txt.match(/pool=(\d+)\/(\d+)/);
  return { txt, pool: pm ? +pm[1] : null, cap: pm ? +pm[2] : null,
           sent: g("sent"), ovf: g("ovf"), late: g("late"), mm: g("mm"),
           run: g("run"), tf: g("tf"), unk: g("unk"),
           /* 播放位置（2026-10-13 新增字段）——
            * heard_tick = play - t0 - lead，这才是"放水基准"给的真实位置，
            * 比 sent/tf 准得多（后者只是喂食量）。 */
           play: g("play"), t0: g("t0"), lead: g("lead"),
           ttot: g("ttot"), pv: g("pv") };
}
function paintStat(d) {
  $("st_pool").textContent = (d.pool ?? "-") + "/" + (d.cap ?? "-");
  $("st_sent").textContent = d.sent ?? "-";
  $("st_tf").textContent   = d.tf ?? "-";
  $("st_ovf").textContent  = d.ovf ?? "-";
  $("st_late").textContent = d.late ?? "-";
  $("st_run").textContent  = d.run === null ? "-" : (d.run ? "运行中" : "已停");
  $("st_unk").textContent  = d.unk ?? "-";
  $("st_mm").textContent   = d.mm ?? "-";
  updateProgress(d);
  const run = $("st_run"); run.style.color = d.run ? "var(--ok)" : "var(--dim)";
  const ovf = $("st_ovf"); ovf.style.color = d.ovf ? "var(--err)" : "var(--fg)";
}

/* ---------------------------------------------------------------------------
 * 播放进度与游标
 * ---------------------------------------------------------------------------
 * 为什么不能直接用 sent/tf 当播放进度（原来的写法）：
 *   `sent` = 已喂给 FPGA 的事件数。而 ESP32 的放水纪律是
 *   「应发到 tick = t0_tick + elapsed - LEAD_TICKS」（LEAD = 20000 tick ≈ 10.4 s）。
 *   => 起播后 sent 会【立刻冲到接近满】，而 FPGA 要再等 ~10.4 秒才出声。
 *   => 用 sent/tf 当进度，游标瞬间跑到最右边，而声音刚开始 —— 时间轴必然对不上。
 *
 * 正确的估计：真正的播放位置 ≈ (sent/tf * 总时长) - 提前量。
 *   注意这是【估计】—— 因为 ESP32 目前不上报"FPGA 真放到哪了"
 *   （需要 FPGA 回传 14 B 实时事件帧，尚未实现）。
 *   => 所以下面明确标出"估计"，并且提前量用倒数显示出来，
 *      让用户知道"现在还没出声"，而不是以为坏了。
 */
const LEAD_SEC_DEFAULT = 10.4;      // BLE_POOL_LEAD_TICKS=20000 tick @120BPM/960PPQN
let playStartWall = null;           // 点起播的本地时刻（ms）
let leadSec = LEAD_SEC_DEFAULT;

function updateProgress(d) {
  const run = !!d.run;
  if (!run) {
    // 停了：位置标记为无效，游标保留在最后一次的位置（方便看"停在哪"）
    if (playFrac !== null) { draw(); }
    const el = $("st_lead");
    if (el) { el.textContent = "-"; el.style.color = "var(--dim)"; }
    return;
  }
  if (playStartWall === null) playStartWall = performance.now();
  const sinceStart = (performance.now() - playStartWall) / 1000;

  /* ---- 播放位置：优先用 ESP32 给的真值，拿不到才退回估算 ---- */
  let heardTick = null, totalTick = null;
  if (d.pv === 1 && d.play != null && d.t0 != null && d.lead != null) {
    const heard = d.play - d.t0 - d.lead;     // 还没出声时为负
    heardTick = Math.max(0, heard);
    totalTick = (d.ttot && d.ttot > 0) ? d.ttot : null;
  } else if (score && d.tf) {
    // 退回估算：喂食比例 * 总时长 - 提前量
    const fedSec = (d.sent / d.tf) * score.duration;
    const secPerTick = score.duration / Math.max(1, score.tickMax);
    heardTick = Math.max(0, (fedSec - leadSec)) / (secPerTick || 1);
    totalTick = score.tickMax;
  }
  if (heardTick !== null && totalTick) {
    playFrac = Math.min(1, heardTick / totalTick);
  }

  // 提前量倒数：还没出声时显示"再等 N 秒"
  const el = $("st_lead");
  if (el) {
    if (sinceStart < leadSec) {
      el.textContent = "再等 " + (leadSec - sinceStart).toFixed(1) + " 秒出声";
      el.style.color = "var(--warn)";
    } else {
      el.textContent = "已出声 " + (sinceStart - leadSec).toFixed(1) + " 秒";
      el.style.color = "var(--ok)";
    }
  }
  // 进度条 = 喂食（实测）
  const bar = $("st_bar");
  if (bar && d.tf) {
    bar.style.width = Math.min(100, (d.sent / d.tf) * 100) + "%";
  }
  draw();
}
async function pollOnce() {
  if (!connected) return;
  try { paintStat(await readStat()); } catch (e) { /* 静默 */ }
}
function startPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollOnce, 1200);
  pollOnce();
}

/* ============================== 上传 ============================== */
let uploading = false;
async function upload() {
  if (!score) { log("先打开谱面", "er"); return; }
  if (!connected) { log("先连接蓝牙", "er"); return; }
  if (uploading) return;
  uploading = true; $("btnUp").disabled = true;
  const pl = score.payload, total = pl.length, CHUNK = 180;
  try {
    log("清池（CMD 0x01）…");
    await sendCmd(CMD_RESET);
    await new Promise(r => setTimeout(r, 800));
    let sent = 0; const t0 = performance.now();
    while (sent < total) {
      const n = Math.min(CHUNK, total - sent);
      await chRecv.writeValueWithoutResponse(pl.subarray(sent, sent + n));
      sent += n;
      const frac = sent / total, dt = (performance.now() - t0) / 1000;
      $("pb").style.width = (frac * 100).toFixed(1) + "%";
      $("pbTxt").textContent = (sent >> 10) + " / " + (total >> 10) + " KB";
      $("pbRate").textContent = ((sent / 1024) / Math.max(dt, 1e-6)).toFixed(1) + " KB/s";
      if ((sent / CHUNK) % 40 === 0) await new Promise(r => setTimeout(r, 0));
    }
    $("pbTxt").textContent = "上传完成";
    log("上传完成：" + total + " 字节 / " + score.words.length + " 事件，用时 " +
        ((performance.now() - t0) / 1000).toFixed(1) + " s", "ok");
    await pollOnce();
  } catch (e) {
    log("上传失败：" + e.message, "er");
  } finally { uploading = false; $("btnUp").disabled = false; }
}

/* ============================== 打开文件 ============================== */
async function openFile(f) {
  const name = f.name.toLowerCase();
  try {
    if (name.endsWith(".mid") || name.endsWith(".midi")) {
      throw new Error("浏览器里读不了 MIDI。请先用 mid2evt.py 转成 events.hex：\n" +
        "  python FPGA2026/tools/mid2evt.py --in \"" + f.name + "\" --out-dir 输出目录\n" +
        "然后把生成的 events.hex 拖进来。");
    }
    const text = await f.text();
    const words = parseEventsHex(text);
    score = buildScore(words, f.name);
    $("fname").textContent = f.name;
    $("s_n").textContent = score.words.length;
    $("s_dur").textContent = score.duration.toFixed(1) + " s";
    $("s_tick").textContent = score.tickMin + " .. " + score.tickMax;
    $("s_tempo").textContent = score.tempos.length + " 个";
    $("s_kind").textContent = Object.keys(score.kinds).sort().map(k =>
      ({ 0: "on", 1: "off", 2: "tempo" }[k] || ("k" + k)) + ":" + score.kinds[k]).join(" ");
    $("s_bytes").textContent = score.payload.length + " B / " +
      Math.round(score.payload.length / 9) + " 帧";
    playFrac = null; hover = null; draw();
    log("已打开 " + f.name + "：" + score.words.length + " 事件，" +
        score.duration.toFixed(1) + " s，" + score.tempos.length + " 个变速点", "ok");
  } catch (e) {
    log("打开失败：" + e.message, "er");
    alert(e.message);
  }
}

/* ============================== 绑定 ============================== */
$("btnConn").onclick = () => connected ? disconnect() : connect();
$("btnUp").onclick = upload;
$("btnPlay").onclick = async () => { try { await sendCmd(CMD_PLAY); log("已发 起播"); } catch (e) { log(e.message, "er"); } };
$("btnStop").onclick = async () => { try { await sendCmd(CMD_STOP); log("已发 停止"); } catch (e) { log(e.message, "er"); } };
$("btnClear").onclick = async () => { try { await sendCmd(CMD_RESET); log("已发 清池"); } catch (e) { log(e.message, "er"); } };

const drop = $("drop"), fileIn = $("file");
drop.onclick = () => fileIn.click();
fileIn.onchange = () => { if (fileIn.files[0]) openFile(fileIn.files[0]); };
["dragenter", "dragover"].forEach(k => drop.addEventListener(k, e => {
  e.preventDefault(); drop.classList.add("hot");
}));
["dragleave", "drop"].forEach(k => drop.addEventListener(k, e => {
  e.preventDefault(); drop.classList.remove("hot");
}));
drop.addEventListener("drop", e => {
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});

/* ============================== 启动 ============================== */
(async function boot() {
  const proto = location.protocol;
  $("proto").textContent = proto === "file:" ? "file:// 模式" : (location.host || proto);
  if (!navigator.bluetooth) {
    $("warn").style.display = "block";
    $("warn").innerHTML = "⚠️ 这个浏览器没有 Web Bluetooth。请用 <b>Chrome</b> 或 <b>Edge</b> 打开本页。";
  } else if (proto === "file:") {
    $("warn").style.display = "block";
    $("warn").innerHTML = "⚠️ 当前是 <b>file://</b> 模式，浏览器多半会拒绝蓝牙。" +
      "请双击同目录的 <b>start_score_studio.bat</b>（它会用 http://127.0.0.1 打开，蓝牙才可用）。";
  }
  fitCanvas();
  log("就绪。先「连接蓝牙」，再打开谱面，然后「一键上传」→「起播」。");
  // ?demo=<相对路径>：自动载入一份谱面，用于演示与自检
  const q = new URLSearchParams(location.search);
  const demo = q.get("demo");
  if (demo) {
    try {
      const r = await fetch(demo);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const t = await r.text();
      await openFile({ name: demo, text: async () => t });
    } catch (e) {
      log("demo 载入失败：" + e.message, "er");
    }
  }
  draw();
})();
</script>
